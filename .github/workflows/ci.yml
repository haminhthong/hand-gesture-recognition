name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cài công cụ kiểm thử
        run: python -m pip install pytest
      - name: Kiểm tra cú pháp
        run: python -m compileall -q GestureDetector.py GestureSmoother.py PerformanceMonitor.py tests
      - name: Chạy unit test
        run: python -m pytest -q
